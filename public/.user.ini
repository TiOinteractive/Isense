; ---------------------------------------------------------------------------
; Limity PHP dla FRONTU (PHP_INI_PERDIR — dzialaja pod FPM/FastCGI).
; Plik jest czytany od public/index.php (front controller), wiec dotyczy KAZDEGO
; zadania aplikacji, tak samo frontu jak panelu.
; ---------------------------------------------------------------------------

; Duze uploady w panelu (menedzer plikow) wymagaja wysokich limitow transferu.
; memory_limit trzymamy nizej niz upload — pliki ida strumieniowo na dysk i nie
; potrzebuja tyle RAM; 256M ogranicza ryzyko OOM przy wielu procesach FPM.
upload_max_filesize=512M
post_max_size=512M
memory_limit=256M

; KLUCZOWE dla stabilnosci: krotki limit czasu na froncie. Pod FPM stare 600 s
; pozwalalo botowi/zacietemu renderowi trzymac workera 10 minut -> pula workerow
; wyczerpywala sie i serwer przestawal odpowiadac (AH00484 MaxRequestWorkers).
; 120 s chroni pule; zadania administracyjne podnosza limit same:
;   - front  -> 120 s (ten plik)
;   - panel  -> 600 s centralnie w App\Filters\AuthGuard (zalogowany admin)
;   - import/generatory/cron -> ini_set() we wlasnym kodzie (Scripts, Search, CronJob)
max_execution_time=120

; UWAGA: NIE wlaczac tu zlib.output_compression — CodeIgniter 4 celowo przerywa
; start (FrameworkException::forEnabledZlibOutputCompression, app/Config/Events.php),
; bo koliduje z jego buforowaniem wyjscia. Kompresje HTML robi mod_deflate w
; public/.htaccess (poziom Apache), a nie PHP.

; UWAGA: OPcache (opcache.enable i tuning) oraz realpath_cache_* to PHP_INI_SYSTEM
; — .user.ini ich NIE zastosuje. Wlaczenie OPcache to najwiekszy pojedynczy zysk
; wydajnosci i klucz do szybszego zwalniania workerow. Patrz DEPLOY_PHP85_SERWER.md.
